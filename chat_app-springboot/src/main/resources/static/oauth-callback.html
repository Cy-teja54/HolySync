<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Google OAuth Callback</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success {
            color: #4ade80;
        }
        .error {
            color: #f87171;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading">
            <div class="spinner"></div>
            <h2>Processing Google Authentication...</h2>
            <p>Please wait while we complete the authentication process.</p>
        </div>
        
        <div id="success" style="display: none;">
            <div style="font-size: 48px; margin-bottom: 20px;">✅</div>
            <h2 class="success">Authentication Successful!</h2>
            <p>You can now close this window and return to the chat.</p>
        </div>
        
        <div id="error" style="display: none;">
            <div style="font-size: 48px; margin-bottom: 20px;">❌</div>
            <h2 class="error">Authentication Failed</h2>
            <p id="errorMessage">An error occurred during authentication.</p>
            <p>Please close this window and try again.</p>
        </div>
    </div>

    <script>
        // Extract authorization code from URL
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');
        const errorDescription = urlParams.get('error_description');

        // Check if we're in a popup window
        if (window.opener) {
            if (error) {
                // Handle OAuth error
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('errorMessage').textContent = errorDescription || error;
                
                // Send error message to parent window
                window.opener.postMessage({
                    type: 'GOOGLE_AUTH_ERROR',
                    error: errorDescription || error
                }, window.location.origin);
            } else if (code) {
                // Handle successful OAuth
                document.getElementById('loading').style.display = 'none';
                document.getElementById('success').style.display = 'block';
                
                // Send success message to parent window
                window.opener.postMessage({
                    type: 'GOOGLE_AUTH_SUCCESS',
                    code: code
                }, window.location.origin);
                
                // Auto-close after 2 seconds
                setTimeout(() => {
                    window.close();
                }, 2000);
            } else {
                // No code or error - something went wrong
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('errorMessage').textContent = 'No authorization code received';
                
                window.opener.postMessage({
                    type: 'GOOGLE_AUTH_ERROR',
                    error: 'No authorization code received'
                }, window.location.origin);
            }
        } else {
            // Not in popup - redirect to main page
            window.location.href = '/chat.html';
        }
    </script>
</body>
</html>
