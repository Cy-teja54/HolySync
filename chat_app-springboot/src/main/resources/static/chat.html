<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chat | HolySync</title>
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #0a0e1f 50%, #111827 100%);
            color: white;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        .floating-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            animation: float 20s ease-in-out infinite;
        }

        .orb1 {
            width: 400px;
            height: 400px;
            background: #1e3a8a;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb2 {
            width: 300px;
            height: 300px;
            background: #1e40af;
            bottom: -50px;
            right: 10%;
            animation-delay: 5s;
        }

        .orb3 {
            width: 250px;
            height: 250px;
            background: #2563eb;
            top: 40%;
            right: -50px;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }
        
        .main-wrapper {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            height: calc(100vh - 40px);
            margin: 20px auto;
            display: flex;
            gap: 20px;
        }

        .chat-container {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tasks-sidebar {
            width: 350px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tasks-header {
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tasks-header h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tasks-header p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }

        .tasks-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .tasks-list::-webkit-scrollbar {
            width: 6px;
        }

        .tasks-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .tasks-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .task-item {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            animation: slideInRight 0.3s ease-out;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideOutRight {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(20px);
            }
        }

        .task-content {
            color: #e5e7eb;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .task-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .task-meta i {
            font-size: 11px;
        }

        .due-date {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            margin-top: 4px;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 500;
        }

        .due-date.overdue {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .due-date.due-soon {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .due-date.due-later {
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .due-date i {
            font-size: 10px;
        }

        .empty-tasks {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            padding: 40px;
        }

        .empty-tasks i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-tasks p {
            font-size: 14px;
        }

        .tasks-footer {
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .google-tasks-btn {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #4285f4 0%, #34a853 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(66, 133, 244, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 15px;
        }

        .google-tasks-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(66, 133, 244, 0.6);
        }

        .google-tasks-btn:active {
            transform: translateY(0);
        }


        .chat-header {
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 600;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .logo-icon::before {
            content: '';
            position: absolute;
            width: 3px;
            height: 16px;
            background: #000;
            border-radius: 2px;
            transform: rotate(-20deg);
            left: 8px;
        }

        .logo-icon::after {
            content: '';
            position: absolute;
            width: 3px;
            height: 16px;
            background: #000;
            border-radius: 2px;
            transform: rotate(20deg);
            right: 8px;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            border-color: rgba(239, 68, 68, 0.5);
            color: #fee2e2;
        }

        #status {
            padding: 10px 20px;
            margin: 10px 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .success { 
            background: rgba(34, 197, 94, 0.1);
            border-color: rgba(34, 197, 94, 0.3);
            color: #86efac;
        }
        
        .error { 
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }
        
        .info { 
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.3);
            color: #93c5fd;
        }
        
        #messageArea {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #messageArea::-webkit-scrollbar {
            width: 8px;
        }

        #messageArea::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        #messageArea::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        #messageArea::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 70%;
            word-wrap: break-word;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message strong {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            opacity: 0.8;
        }

        .event-message {
            align-self: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a5b4fc;
            font-style: italic;
            font-size: 14px;
            max-width: 100%;
            text-align: center;
        }

        .chat-message {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e5e7eb;
        }

        .own-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #134e4a 0%, #115e59 100%);
            border: 1px solid rgba(19, 78, 74, 0.5);
            color: white;
        }

        .message-form {
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 12px;
        }
        
        #messageInput {
            flex: 1;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        #messageInput::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        #messageInput:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(19, 78, 74, 0.5);
            box-shadow: 0 0 0 3px rgba(19, 78, 74, 0.1);
        }
        
        .send-btn {
            padding: 14px 28px;
            background: linear-gradient(135deg, #134e4a 0%, #115e59 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(19, 78, 74, 0.4);
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(19, 78, 74, 0.6);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .hidden {
            display: none;
        }

        @media (max-width: 1200px) {
            .main-wrapper {
                flex-direction: column;
            }

            .tasks-sidebar {
                width: 100%;
                max-height: 300px;
            }
        }

        @media (max-width: 768px) {
            .main-wrapper {
                margin: 10px;
                height: calc(100vh - 20px);
            }

            .chat-container {
                border-radius: 15px;
            }

            .chat-header {
                padding: 15px 20px;
            }

            .logo {
                font-size: 20px;
            }

            .message {
                max-width: 85%;
            }

            .message-form {
                padding: 15px;
            }

            .tasks-sidebar {
                max-height: 250px;
            }

            .tasks-header h2 {
                font-size: 16px;
            }

            .task-item {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="floating-orbs">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>

    <div class="main-wrapper">
        <div class="chat-container">
            <div class="chat-header">
                <div class="logo">
                    <div class="logo-icon"></div>
                    <span>Group Chat</span>
                </div>
                <button onclick="disconnect()" class="logout-btn">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>

            <div id="status" class="info">Connecting...</div>
            
            <div id="messageArea"></div>
            
            <form class="message-form" onsubmit="sendMessage(event)">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type your message..."
                    autocomplete="off"
                />
                <button type="submit" class="send-btn">
                    <i class="fa-solid fa-paper-plane"></i> Send
                </button>
            </form>
        </div>

        <div class="tasks-sidebar">
            <div class="tasks-header">
                <h2>
                    <i class="fa-solid fa-sparkles"></i>
                    AI Extracted Tasks
                </h2>
                <p>Tasks automatically detected from chat</p>
            </div>

            <div class="tasks-list" id="tasksList">
                <div class="empty-tasks">
                    <i class="fa-solid fa-clipboard-list"></i>
                    <p>No tasks detected yet. The AI will automatically extract tasks from your conversations.</p>
                </div>
            </div>

            <div class="tasks-footer">
                <button class="google-tasks-btn" onclick="initiateGoogleAuth()">
                    <i class="fa-brands fa-google"></i>
                    Add to Google Tasks
                </button>
            </div>
        </div>
    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://unpkg.com/compromise@14.9.0/builds/compromise.min.js"></script>
    <script src="js/nlp-task-extractor.js"></script>
    
    <script>
        var stompClient = null;
        var username = null;
        var extractedTasks = [];
        
        function updateStatus(message, className) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = className;
        }

        // Google Tasks OAuth flow
        async function initiateGoogleAuth() {
            try {
                // Get authorization URL from backend
                const response = await fetch('/api/google-tasks/auth-url');
                const data = await response.json();
                
                if (response.ok) {
                    // Open popup window for OAuth
                    const popup = window.open(
                        data.authUrl,
                        'googleAuth',
                        'width=500,height=600,scrollbars=yes,resizable=yes'
                    );
                    
                    // Listen for popup completion
                    const checkClosed = setInterval(() => {
                        if (popup.closed) {
                            clearInterval(checkClosed);
                            showToast('OAuth popup was closed. Please try again.', 'error');
                        }
                    }, 1000);
                    
                    // Listen for message from popup
                    window.addEventListener('message', async function(event) {
                        if (event.origin !== window.location.origin) {
                            return; // Security check
                        }
                        
                        if (event.data.type === 'GOOGLE_AUTH_SUCCESS') {
                            clearInterval(checkClosed);
                            popup.close();
                            await handleOAuthCallback(event.data.code);
                        } else if (event.data.type === 'GOOGLE_AUTH_ERROR') {
                            clearInterval(checkClosed);
                            popup.close();
                            showToast('OAuth authentication failed: ' + event.data.error, 'error');
                        }
                    });
                    
                } else {
                    const details = data && data.details ? `\nDetails: ${JSON.stringify(data.details)}` : '';
                    showToast('Failed to get authorization URL: ' + data.error + details, 'error');
                }
            } catch (error) {
                console.error('OAuth initiation error:', error);
                showToast('Error initiating Google authentication: ' + error.message, 'error');
            }
        }

        async function handleOAuthCallback(code) {
            try {
                const response = await fetch('/api/google-tasks/callback', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ code: code })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Export tasks to Google Tasks
                    await exportTasksToGoogle(data.accessToken);
                } else {
                    showToast('OAuth callback failed: ' + data.error, 'error');
                }
            } catch (error) {
                console.error('OAuth callback error:', error);
                showToast('Error processing OAuth callback: ' + error.message, 'error');
            }
        }

        async function exportTasksToGoogle(accessToken) {
            if (extractedTasks.length === 0) {
                showToast('No tasks to export!', 'info');
                return;
            }

            try {
                // Prepare tasks data
                const tasksData = extractedTasks.map(task => ({
                    content: task.content,
                    sender: task.sender,
                    dueDate: task.dueDate,
                    timestamp: task.timestamp
                }));

                const response = await fetch('/api/google-tasks/export', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        accessToken: accessToken,
                        tasks: tasksData
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    showToast(`Successfully exported ${data.createdCount} tasks to Google Tasks!`, 'success');
                    // Optionally clear the tasks after successful export
                    // extractedTasks = [];
                    // renderTasks();
                } else {
                    showToast('Failed to export tasks: ' + data.error, 'error');
                }
            } catch (error) {
                console.error('Export error:', error);
                showToast('Error exporting tasks: ' + error.message, 'error');
            }
        }

        function showToast(message, type) {
            // Create a temporary message element
            const messageElement = document.createElement('div');
            messageElement.className = `message ${type}-message`;
            messageElement.textContent = message;
            messageElement.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 20px;
                border-radius: 8px;
                color: white;
                font-weight: 500;
                z-index: 1000;
                max-width: 400px;
                animation: slideInRight 0.3s ease-out;
            `;
            
            if (type === 'success') {
                messageElement.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
            } else if (type === 'error') {
                messageElement.style.background = 'linear-gradient(135deg, #ef4444 0%, #dc2626 100%)';
            } else if (type === 'info') {
                messageElement.style.background = 'linear-gradient(135deg, #3b82f6 0%, #2563eb 100%)';
            }
            
            document.body.appendChild(messageElement);
            
            // Remove message after 5 seconds
            setTimeout(() => {
                messageElement.style.animation = 'slideOutRight 0.3s ease-out';
                setTimeout(() => {
                    if (messageElement.parentNode) {
                        messageElement.parentNode.removeChild(messageElement);
                    }
                }, 300);
            }, 5000);
        }

        // Task management functions
        function addTask(taskData, sender) {
            const task = {
                content: taskData.content,
                sender: sender,
                timestamp: new Date().toLocaleTimeString(),
                dueDate: taskData.dueDate,
                dueDateString: taskData.dueDateString,
                confidence: taskData.confidence || 0.5
            };
            
            extractedTasks.push(task);
            renderTasks();
        }

        function renderTasks() {
            const tasksList = document.getElementById('tasksList');
            
            if (extractedTasks.length === 0) {
                tasksList.innerHTML = `
                    <div class="empty-tasks">
                        <i class="fa-solid fa-clipboard-list"></i>
                        <p>No tasks detected yet. The AI will automatically extract tasks from your conversations.</p>
                    </div>
                `;
                return;
            }

            tasksList.innerHTML = '';
            extractedTasks.forEach(task => {
                const taskElement = document.createElement('div');
                taskElement.className = 'task-item';
                
                // Determine due date styling
                let dueDateClass = '';
                let dueDateIcon = '';
                let dueDateText = '';
                
                if (task.dueDate) {
                    const dueDate = new Date(task.dueDate);
                    if (isOverdue(dueDate)) {
                        dueDateClass = 'overdue';
                        dueDateIcon = 'fa-solid fa-exclamation-triangle';
                        dueDateText = `Overdue: ${formatDateForDisplay(dueDate)}`;
                    } else if (isDueSoon(dueDate)) {
                        dueDateClass = 'due-soon';
                        dueDateIcon = 'fa-solid fa-clock';
                        dueDateText = `Due: ${formatDateForDisplay(dueDate)}`;
                    } else {
                        dueDateClass = 'due-later';
                        dueDateIcon = 'fa-solid fa-calendar';
                        dueDateText = `Due: ${formatDateForDisplay(dueDate)}`;
                    }
                }
                
                taskElement.innerHTML = `
                    <div class="task-content">${task.content}</div>
                    <div class="task-meta">
                        <i class="fa-solid fa-user"></i>
                        <span>${task.sender}</span>
                        <i class="fa-solid fa-clock"></i>
                        <span>${task.timestamp}</span>
                        ${task.dueDate ? `
                            <div class="due-date ${dueDateClass}">
                                <i class="${dueDateIcon}"></i>
                                <span>${dueDateText}</span>
                            </div>
                        ` : ''}
                    </div>
                `;
                tasksList.appendChild(taskElement);
            });
        }

        function detectTasks(message) {
            // Use NLP to extract tasks from the message
            const extractedTasks = extractTasksFromMessage(message.content);
            
            extractedTasks.forEach(taskData => {
                // Only add tasks with reasonable confidence
                if (taskData.confidence >= 0.3) {
                    addTask(taskData, message.sender);
                }
            });
        }
        
        // Check for username in URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const urlUsername = urlParams.get('user');
        
        if (!urlUsername) {
            window.location.href = 'login.html';
        } else {
            username = urlUsername;
            setTimeout(connect, 500);
        }
        
        function connect() {
            if (!username) {
                return;
            }
            
            updateStatus('Connecting...', 'info');
            
            try {
                const socket = new SockJS('/websocket');
                stompClient = Stomp.over(socket);
                
                stompClient.connect({}, function(frame) {
                    console.log('Connected!');
                    updateStatus('Connected as ' + username, 'success');
                    
                    // Hide status after 2 seconds
                    setTimeout(() => {
                        document.getElementById('status').classList.add('hidden');
                    }, 2000);
                    
                    stompClient.subscribe('/topic/public', function(message) {
                        showMessage(JSON.parse(message.body));
                    });
                    
                    stompClient.send("/app/chat.register", {}, 
                        JSON.stringify({sender: username, type: 'JOIN'}));
                    
                }, function(error) {
                    console.error('Connection error:', error);
                    updateStatus('Connection failed!', 'error');
                });
                
            } catch (e) {
                console.error('Exception:', e);
                updateStatus('Connection error!', 'error');
            }
        }
        
        function disconnect() {
            if (stompClient !== null) {
                stompClient.disconnect();
            }
            window.location.href = 'login.html';
        }
        
        function sendMessage(event) {
            event.preventDefault();
            
            const messageInput = document.getElementById('messageInput');
            const content = messageInput.value.trim();
            
            if (content && stompClient) {
                const chatMessage = {
                    sender: username,
                    content: content,
                    type: 'CHAT'
                };
                stompClient.send("/app/chat.send", {}, JSON.stringify(chatMessage));
                messageInput.value = '';
            }
        }
        
        function showMessage(message) {
            const messageArea = document.getElementById('messageArea');
            const messageElement = document.createElement('div');
            messageElement.className = 'message';
            
            if (message.type === 'JOIN') {
                messageElement.className += ' event-message';
                messageElement.textContent = message.sender + ' joined the chat';
            } else if (message.type === 'LEAVE') {
                messageElement.className += ' event-message';
                messageElement.textContent = message.sender + ' left the chat';
            } else {
                messageElement.className += ' chat-message';
                if (message.sender === username) {
                    messageElement.className += ' own-message';
                    messageElement.innerHTML = message.content;
                } else {
                    messageElement.innerHTML = '<strong>' + message.sender + '</strong>' + message.content;
                }
                
                // Detect tasks only for the intended recipient or own messages
                try {
                    const contentText = (message.content || '').toString();
                    const mentionedCurrentUser = username && contentText.includes('@' + username);
                    const isOwnMessage = message.sender === username;
                    if (isOwnMessage || mentionedCurrentUser) {
                        detectTasks(message);
                    }
                } catch (e) {
                    // no-op if message shape is unexpected
                }
            }
            
            messageArea.appendChild(messageElement);
            messageArea.scrollTop = messageArea.scrollHeight;
        }
        
        // Allow Enter key to send message
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage(e);
            }
        });
    </script>
</body>
