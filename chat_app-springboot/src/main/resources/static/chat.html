<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chat | HolySync</title>
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #0a0e1f 50%, #111827 100%);
            color: white;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        .floating-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            animation: float 20s ease-in-out infinite;
        }

        .orb1 {
            width: 400px;
            height: 400px;
            background: #1e3a8a;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb2 {
            width: 300px;
            height: 300px;
            background: #1e40af;
            bottom: -50px;
            right: 10%;
            animation-delay: 5s;
        }

        .orb3 {
            width: 250px;
            height: 250px;
            background: #2563eb;
            top: 40%;
            right: -50px;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }
        
        .main-wrapper {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            height: calc(100vh - 40px);
            margin: 20px auto;
            display: flex;
            gap: 20px;
        }

        .chat-container {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tasks-sidebar {
            width: 350px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tasks-header {
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tasks-header h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tasks-header p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }

        .tasks-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .tasks-list::-webkit-scrollbar {
            width: 6px;
        }

        .tasks-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .tasks-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .task-item {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            animation: slideInRight 0.3s ease-out;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .task-content {
            color: #e5e7eb;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .task-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .task-meta i {
            font-size: 11px;
        }

        .empty-tasks {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            padding: 40px;
        }

        .empty-tasks i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-tasks p {
            font-size: 14px;
        }

        .tasks-footer {
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .google-tasks-btn {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #4285f4 0%, #34a853 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(66, 133, 244, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 15px;
        }

        .google-tasks-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(66, 133, 244, 0.6);
        }

        .google-tasks-btn:active {
            transform: translateY(0);
        }

        .construction-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .construction-content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            animation: scaleIn 0.3s ease;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .construction-content i {
            font-size: 64px;
            color: #fbbf24;
            margin-bottom: 20px;
        }

        .construction-content h3 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .construction-content p {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .close-modal-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .close-modal-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .chat-header {
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 600;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .logo-icon::before {
            content: '';
            position: absolute;
            width: 3px;
            height: 16px;
            background: #000;
            border-radius: 2px;
            transform: rotate(-20deg);
            left: 8px;
        }

        .logo-icon::after {
            content: '';
            position: absolute;
            width: 3px;
            height: 16px;
            background: #000;
            border-radius: 2px;
            transform: rotate(20deg);
            right: 8px;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            border-color: rgba(239, 68, 68, 0.5);
            color: #fee2e2;
        }

        #status {
            padding: 10px 20px;
            margin: 10px 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .success { 
            background: rgba(34, 197, 94, 0.1);
            border-color: rgba(34, 197, 94, 0.3);
            color: #86efac;
        }
        
        .error { 
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }
        
        .info { 
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.3);
            color: #93c5fd;
        }
        
        #messageArea {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #messageArea::-webkit-scrollbar {
            width: 8px;
        }

        #messageArea::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        #messageArea::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        #messageArea::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 70%;
            word-wrap: break-word;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message strong {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            opacity: 0.8;
        }

        .event-message {
            align-self: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a5b4fc;
            font-style: italic;
            font-size: 14px;
            max-width: 100%;
            text-align: center;
        }

        .chat-message {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e5e7eb;
        }

        .own-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #134e4a 0%, #115e59 100%);
            border: 1px solid rgba(19, 78, 74, 0.5);
            color: white;
        }

        .message-form {
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 12px;
        }
        
        #messageInput {
            flex: 1;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        #messageInput::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        #messageInput:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(19, 78, 74, 0.5);
            box-shadow: 0 0 0 3px rgba(19, 78, 74, 0.1);
        }
        
        .send-btn {
            padding: 14px 28px;
            background: linear-gradient(135deg, #134e4a 0%, #115e59 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(19, 78, 74, 0.4);
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(19, 78, 74, 0.6);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .hidden {
            display: none;
        }

        @media (max-width: 1200px) {
            .main-wrapper {
                flex-direction: column;
            }

            .tasks-sidebar {
                width: 100%;
                max-height: 300px;
            }
        }

        @media (max-width: 768px) {
            .main-wrapper {
                margin: 10px;
                height: calc(100vh - 20px);
            }

            .chat-container {
                border-radius: 15px;
            }

            .chat-header {
                padding: 15px 20px;
            }

            .logo {
                font-size: 20px;
            }

            .message {
                max-width: 85%;
            }

            .message-form {
                padding: 15px;
            }

            .tasks-sidebar {
                max-height: 250px;
            }

            .tasks-header h2 {
                font-size: 16px;
            }

            .task-item {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="floating-orbs">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>

    <div class="main-wrapper">
        <div class="chat-container">
            <div class="chat-header">
                <div class="logo">
                    <div class="logo-icon"></div>
                    <span>Group Chat</span>
                </div>
                <button onclick="disconnect()" class="logout-btn">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>

            <div id="status" class="info">Connecting...</div>
            
            <div id="messageArea"></div>
            
            <form class="message-form" onsubmit="sendMessage(event)">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type your message..."
                    autocomplete="off"
                />
                <button type="submit" class="send-btn">
                    <i class="fa-solid fa-paper-plane"></i> Send
                </button>
            </form>
        </div>

        <div class="tasks-sidebar">
            <div class="tasks-header">
                <h2>
                    <i class="fa-solid fa-sparkles"></i>
                    AI Extracted Tasks
                </h2>
                <p>Tasks automatically detected from chat</p>
            </div>

            <div class="tasks-list" id="tasksList">
                <div class="empty-tasks">
                    <i class="fa-solid fa-clipboard-list"></i>
                    <p>No tasks detected yet. The AI will automatically extract tasks from your conversations.</p>
                </div>
            </div>

            <div class="tasks-footer">
                <button class="google-tasks-btn" onclick="showConstructionModal()">
                    <i class="fa-brands fa-google"></i>
                    Add to Google Tasks
                </button>
            </div>
        </div>
    </div>

    <div id="constructionModal" class="construction-modal hidden">
        <div class="construction-content">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <h3>Under Construction</h3>
            <p>Google Tasks integration is coming soon! We're working hard to bring you seamless task management.</p>
            <button class="close-modal-btn" onclick="closeConstructionModal()">Got it</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    
    <script>
        var stompClient = null;
        var username = null;
        var extractedTasks = [];
        
        function updateStatus(message, className) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = className;
        }

        function showConstructionModal() {
            document.getElementById('constructionModal').classList.remove('hidden');
        }

        function closeConstructionModal() {
            document.getElementById('constructionModal').classList.add('hidden');
        }

        // Close modal when clicking outside
        document.addEventListener('click', function(event) {
            const modal = document.getElementById('constructionModal');
            if (event.target === modal) {
                closeConstructionModal();
            }
        });

        // Task management functions
        function addTask(taskContent, sender) {
            const task = {
                content: taskContent,
                sender: sender,
                timestamp: new Date().toLocaleTimeString()
            };
            
            extractedTasks.push(task);
            renderTasks();
        }

        function renderTasks() {
            const tasksList = document.getElementById('tasksList');
            
            if (extractedTasks.length === 0) {
                tasksList.innerHTML = `
                    <div class="empty-tasks">
                        <i class="fa-solid fa-clipboard-list"></i>
                        <p>No tasks detected yet. The AI will automatically extract tasks from your conversations.</p>
                    </div>
                `;
                return;
            }

            tasksList.innerHTML = '';
            extractedTasks.forEach(task => {
                const taskElement = document.createElement('div');
                taskElement.className = 'task-item';
                taskElement.innerHTML = `
                    <div class="task-content">${task.content}</div>
                    <div class="task-meta">
                        <i class="fa-solid fa-user"></i>
                        <span>${task.sender}</span>
                        <i class="fa-solid fa-clock"></i>
                        <span>${task.timestamp}</span>
                    </div>
                `;
                tasksList.appendChild(taskElement);
            });
        }

        function detectTasks(message) {
            const taskPatterns = [
                /todo[:\s]+(.+)/i,
                /task[:\s]+(.+)/i,
                /reminder[:\s]+(.+)/i,
                /need to[:\s]+(.+)/i,
                /don't forget to[:\s]+(.+)/i
            ];

            for (const pattern of taskPatterns) {
                const match = message.content.match(pattern);
                if (match) {
                    addTask(match[1].trim(), message.sender);
                    break;
                }
            }
        }
        
        // Check for username in URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const urlUsername = urlParams.get('user');
        
        if (!urlUsername) {
            window.location.href = 'login.html';
        } else {
            username = urlUsername;
            setTimeout(connect, 500);
        }
        
        function connect() {
            if (!username) {
                return;
            }
            
            updateStatus('Connecting...', 'info');
            
            try {
                const socket = new SockJS('/websocket');
                stompClient = Stomp.over(socket);
                
                stompClient.connect({}, function(frame) {
                    console.log('Connected!');
                    updateStatus('Connected as ' + username, 'success');
                    
                    // Hide status after 2 seconds
                    setTimeout(() => {
                        document.getElementById('status').classList.add('hidden');
                    }, 2000);
                    
                    stompClient.subscribe('/topic/public', function(message) {
                        showMessage(JSON.parse(message.body));
                    });
                    
                    stompClient.send("/app/chat.register", {}, 
                        JSON.stringify({sender: username, type: 'JOIN'}));
                    
                }, function(error) {
                    console.error('Connection error:', error);
                    updateStatus('Connection failed!', 'error');
                });
                
            } catch (e) {
                console.error('Exception:', e);
                updateStatus('Connection error!', 'error');
            }
        }
        
        function disconnect() {
            if (stompClient !== null) {
                stompClient.disconnect();
            }
            window.location.href = 'login.html';
        }
        
        function sendMessage(event) {
            event.preventDefault();
            
            const messageInput = document.getElementById('messageInput');
            const content = messageInput.value.trim();
            
            if (content && stompClient) {
                const chatMessage = {
                    sender: username,
                    content: content,
                    type: 'CHAT'
                };
                stompClient.send("/app/chat.send", {}, JSON.stringify(chatMessage));
                messageInput.value = '';
            }
        }
        
        function showMessage(message) {
            const messageArea = document.getElementById('messageArea');
            const messageElement = document.createElement('div');
            messageElement.className = 'message';
            
            if (message.type === 'JOIN') {
                messageElement.className += ' event-message';
                messageElement.textContent = message.sender + ' joined the chat';
            } else if (message.type === 'LEAVE') {
                messageElement.className += ' event-message';
                messageElement.textContent = message.sender + ' left the chat';
            } else {
                messageElement.className += ' chat-message';
                if (message.sender === username) {
                    messageElement.className += ' own-message';
                    messageElement.innerHTML = message.content;
                } else {
                    messageElement.innerHTML = '<strong>' + message.sender + '</strong>' + message.content;
                }
                
                // Detect tasks in chat messages
                detectTasks(message);
            }
            
            messageArea.appendChild(messageElement);
            messageArea.scrollTop = messageArea.scrollHeight;
        }
        
        // Allow Enter key to send message
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage(e);
            }
        });
    </script>
</body>
</html>
