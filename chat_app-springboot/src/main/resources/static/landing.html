<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HolySync - Never Miss a Deadline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #0a0e1f 50%, #111827 100%);
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        nav {
            padding: 15px 0;
            display: flex;
            align-items: center;
            animation: fadeInDown 0.8s ease-out;
        }

        .nav-login {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            padding: 10px 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .nav-login:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .cta-button {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            color: white;
            padding: 18px 40px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(37, 99, 235, 0.4);
            opacity: 0;
            animation: fadeIn 1s ease-out 0.6s forwards;
            text-decoration: none;
            display: inline-block;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 50px rgba(37, 99, 235, 0.6);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 600;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .logo-icon::before {
            content: '';
            position: absolute;
            width: 3px;
            height: 16px;
            background: #000;
            border-radius: 2px;
            transform: rotate(-20deg);
            left: 8px;
        }

        .logo-icon::after {
            content: '';
            position: absolute;
            width: 3px;
            height: 16px;
            background: #000;
            border-radius: 2px;
            transform: rotate(20deg);
            right: 8px;
        }

        .hero {
            padding: 60px 0 80px;
            position: relative;
            min-height: calc(100vh - 120px);
            display: flex;
            align-items: center;
        }

        .hero-content {
            max-width: 600px;
            animation: fadeInUp 1s ease-out;
        }

        h1 {
            font-size: 72px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 20px;
            line-height: 1.6;
            color: #a5b4fc;
            margin-bottom: 50px;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.3s forwards;
        }

        .sparkle {
            position: absolute;
            width: 40px;
            height: 40px;
            right: 100px;
            bottom: 100px;
            animation: sparkle 3s ease-in-out infinite;
        }

        .sparkle svg {
            width: 100%;
            height: 100%;
            fill: #8b5cf6;
            filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.5));
        }

        .floating-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            animation: float 20s ease-in-out infinite;
        }

        .orb1 {
            width: 400px;
            height: 400px;
            background: #1e3a8a;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb2 {
            width: 300px;
            height: 300px;
            background: #1e40af;
            bottom: -50px;
            right: 10%;
            animation-delay: 5s;
        }

        .orb3 {
            width: 250px;
            height: 250px;
            background: #2563eb;
            top: 40%;
            right: -50px;
            animation-delay: 10s;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes sparkle {
            0%, 100% {
                transform: rotate(0deg) scale(1);
                opacity: 0.8;
            }
            50% {
                transform: rotate(180deg) scale(1.2);
                opacity: 1;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 48px;
            }

            .subtitle {
                font-size: 18px;
            }

            .sparkle {
                right: 20px;
                bottom: 50px;
                width: 30px;
                height: 30px;
            }

            .hero {
                padding: 60px 0 100px;
            }
        }
    </style>
</head>
<body>
    <div class="floating-orbs">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>

    <div class="container">
        <nav>
            <div class="logo">
                <div class="logo-icon"></div>
                <span>HolySync</span>
            </div>
        </nav>

        <section class="hero">
            <div class="hero-content">
                <h1>Never Miss a Deadline • Chat Smarter with AI</h1>
                <p class="subtitle">Real-time conversations that turn into organized tasks, summaries, and synced to-dos • all powered by AI.</p>
                <!-- UPDATED: Changed from index.html to login.html -->
                <a href="login.html" class="cta-button">Login</a>
            </div>

            <div class="sparkle">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/>
                </svg>
            </div>
        </section>
    </div>

    <script>
        const sparkle = document.querySelector('.sparkle');
        let rotation = 0;
        setInterval(() => {
            rotation += 1;
            sparkle.style.transform = `rotate(${rotation}deg)`;
        }, 50);
    </script>
</body>
</html>
