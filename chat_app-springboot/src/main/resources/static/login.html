<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0"/>
    <title>Login | HolySync</title>
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #0a0e1f 50%, #111827 100%);
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .floating-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            animation: float 20s ease-in-out infinite;
        }

        .orb1 {
            width: 400px;
            height: 400px;
            background: #1e3a8a;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb2 {
            width: 300px;
            height: 300px;
            background: #1e40af;
            bottom: -50px;
            right: 10%;
            animation-delay: 5s;
        }

        .orb3 {
            width: 250px;
            height: 250px;
            background: #2563eb;
            top: 40%;
            right: -50px;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }

        .login-container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 50px 60px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .logo-icon::before {
            content: '';
            position: absolute;
            width: 3px;
            height: 18px;
            background: #000;
            border-radius: 2px;
            transform: rotate(-20deg);
            left: 9px;
        }

        .logo-icon::after {
            content: '';
            position: absolute;
            width: 3px;
            height: 18px;
            background: #000;
            border-radius: 2px;
            transform: rotate(20deg);
            right: 9px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-control {
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            color: white;
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-control:focus {
            border-color: rgba(99, 102, 241, 0.5);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        #mes {
            display: block;
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 5px;
            min-height: 20px;
        }

        .username-submit {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
            margin-top: 10px;
        }

        .username-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.5);
        }

        .username-submit:active {
            transform: translateY(0);
        }

        .back-link {
            text-align: center;
            margin-top: 30px;
        }

        .back-link a {
            color: #a5b4fc;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: #ffffff;
        }

        .sparkle {
            position: fixed;
            width: 40px;
            height: 40px;
            right: 100px;
            bottom: 100px;
            animation: sparkle 3s ease-in-out infinite;
            z-index: 1;
        }

        .sparkle svg {
            width: 100%;
            height: 100%;
            fill: #8b5cf6;
            filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.5));
        }

        @keyframes sparkle {
            0%, 100% {
                transform: rotate(0deg) scale(1);
                opacity: 0.8;
            }
            50% {
                transform: rotate(180deg) scale(1.2);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .login-container {
                padding: 40px 30px;
                max-width: 90%;
            }

            h1 {
                font-size: 28px;
            }

            .sparkle {
                right: 20px;
                bottom: 50px;
                width: 30px;
                height: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="floating-orbs">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>

    <noscript>
        <h2>Please enable JavaScript in your browser!!!</h2>
    </noscript>
    
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon"></div>
            <span>HolySync</span>
        </div>
        
        <h1>Welcome Back</h1>
        
        <form id="usernameForm" name="usernameForm">
            <div class="form-group">
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    autocomplete="off"
                    class="form-control"
                    autofocus
                />
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="off"
                    class="form-control"
                />
                <span id="mes"></span>
            </div>
            <div class="form-group">
                <button type="submit" class="username-submit">
                    <i class="fa-solid fa-right-to-bracket"></i> Enter Chat
                </button>
            </div>
        </form>
        
        <div class="back-link">
            <a href="landing.html">Back to Home</a>
        </div>
    </div>

    <div class="sparkle">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/>
        </svg>
    </div>

    <script>
    "use strict";

    var usernameForm = document.querySelector("#usernameForm");

    function login(event) {
        event.preventDefault();
        
        var username = document.querySelector("#name").value.trim();
        var password = document.querySelector("#password").value;
        
        if (!username) {
            let mes = document.getElementById("mes");
            mes.innerText = "Please enter your name";
            return;
        }
        
        // Check password
        if (password === "hello") {
            console.log("Login successful, redirecting with username:", username);
            
            // Redirect to chat page with username in URL
            window.location.href = "chat.html?user=" + encodeURIComponent(username);
        } else {
            let mes = document.getElementById("mes");
            mes.innerText = "Wrong password";
        }
    }

    usernameForm.addEventListener("submit", login, true);
    </script>
</body>
</html>
