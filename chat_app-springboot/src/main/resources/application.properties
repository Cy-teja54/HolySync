spring.security.user.name=admin
spring.security.user.password=admin123

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/holysync
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (optional - for viewing data in browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Enable Environment Variable Processing
spring.config.import=optional:file:.env[.properties]

# Security Configuration
spring.security.filter.order=10
server.servlet.session.tracking-modes=cookie

# Google OAuth Configuration
google.oauth.redirect-uri=http://localhost:8080/oauth-callback.html

# Spring Security OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:${google.oauth.client-id:}}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:${google.oauth.client-secret:}}
spring.security.oauth2.client.registration.google.redirect-uri=${google.oauth.redirect-uri}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/tasks

# OAuth2 Provider Configuration
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

# Security Endpoints
spring.security.oauth2.client.registration.google.provider=google
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
